name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bun-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test (TypeScript)
        run: bun test

      - name: Test desktop contracts (Node)
        run: >-
          node --test
          scripts/dashboard-branding.contract.mjs
          scripts/dashboard-ultron-security.contract.mjs
          scripts/dashboard-usage-guide.contract.mjs

      - name: Typecheck supported Eclipse contracts
        run: bun run typecheck:supported

      - name: Audit inherited TypeScript debt
        run: bun run typecheck:debt

  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install httpx pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest test_smart_router.py test_atomic_chat_provider.py test_ollama_provider.py -v

  windows-doctor:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Windows Doctor contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sentinel-windows-doctor.ps1 -SelfTest
